name: DDPE build verification

on:
  pull_request:
    branches:
      - main
      - repair/build-fix
      - feature/mobile-three-tab-risk-settings
      - feature/differs-accuracy-strip
      - feature/secure-neon-backend
      - deploy/vercel-neon-adapter
      - fix/ddpe-runtime-data-integrity
  push:
    branches:
      - feature/secure-neon-backend
      - deploy/vercel-neon-adapter
      - fix/ddpe-runtime-data-integrity
      - fix/vercel-only-neon-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Vercel backend function syntax
        run: node --check server/api-handler.mjs && node --check api/index.mjs
      - name: Run API smoke tests
        run: node --test tests/api.test.mjs
      - name: Run TypeScript and Vite production build
        run: npm run build
