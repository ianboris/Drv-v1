name: DDPE build verification

on:
  pull_request:
    branches:
      - main
      - repair/build-fix
      - feature/mobile-three-tab-risk-settings
      - feature/differs-accuracy-strip
      - feature/secure-neon-backend
  push:
    branches:
      - feature/secure-neon-backend
      - deploy/vercel-neon-adapter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check backend function syntax
        run: node --check netlify/functions/api.mjs
      - name: Run API smoke tests
        run: node --test tests/api.test.mjs
      - name: Run TypeScript and Vite production build
        run: npm run build
