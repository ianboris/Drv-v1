name: Lotus strategy lab verification

on:
  pull_request:
    paths:
      - 'src/research-analytics.mjs'
      - 'tests/research-analytics.test.mjs'
      - 'scripts/lotus-research-report.mjs'
      - 'src/strategy-lab.mjs'
      - 'src/advanced-model.mjs'
      - 'src/advanced-model.d.mts'
      - 'src/main.tsx'
      - 'src/live-tick-identity.mjs'
      - 'src/live-tick-identity.d.mts'
      - 'tests/live-tick-identity.test.mjs'
      - 'src/digit-contracts.mjs'
      - 'src/digit-contracts.d.mts'
      - 'tests/digit-contracts.test.mjs'
      - 'tests/backtest.test.mjs'
      - 'src/style.css'
      - 'tests/advanced-model.test.mjs'
      - 'docs/strategy-lab.md'
      - 'scripts/capture-deriv-proposals.mjs'
      - 'scripts/lotus-strategy-lab.mjs'
      - 'tests/strategy-lab.test.mjs'
      - 'package.json'
      - '.github/workflows/lotus-strategy-lab.yml'
  push:
    branches:
      - feat/lotus-stake-window-optimization
      - feat/lotus-advanced-model
    paths:
      - 'src/research-analytics.mjs'
      - 'tests/research-analytics.test.mjs'
      - 'scripts/lotus-research-report.mjs'
      - 'src/strategy-lab.mjs'
      - 'src/advanced-model.mjs'
      - 'src/advanced-model.d.mts'
      - 'src/main.tsx'
      - 'src/live-tick-identity.mjs'
      - 'src/live-tick-identity.d.mts'
      - 'tests/live-tick-identity.test.mjs'
      - 'src/digit-contracts.mjs'
      - 'src/digit-contracts.d.mts'
      - 'tests/digit-contracts.test.mjs'
      - 'tests/backtest.test.mjs'
      - 'src/style.css'
      - 'tests/advanced-model.test.mjs'
      - 'docs/strategy-lab.md'
      - 'scripts/capture-deriv-proposals.mjs'
      - 'scripts/lotus-strategy-lab.mjs'
      - 'tests/strategy-lab.test.mjs'
      - 'package.json'
      - '.github/workflows/lotus-strategy-lab.yml'

jobs:
  strategy-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:strategy-lab
      - run: npm run test:advanced-model
      - run: npm run build
