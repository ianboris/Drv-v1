name: Neon Branching

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  neon_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or manage Neon branch
        uses: neondatabase/create-branch-action@v5 # Or your preferred Neon action setup
        with:
         project_id: ${{ secrets.NEON_PROJECT_ID }}
         api_key: ${{ secrets.NEON_API_KEY }}
